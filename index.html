<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Medien Lernen" />
    <title>Medien Lernen</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Medienfachfrau</p>
          <h1>Medien Lernen</h1>
        </div>
        <div class="progress-ring" aria-label="Lernfortschritt">
          <svg viewBox="0 0 48 48" role="img" aria-hidden="true">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-value" id="progressCircle" cx="24" cy="24" r="20"></circle>
          </svg>
          <span id="progressPercent">0%</span>
        </div>
      </header>

      <main>
        <section class="control-panel">
          <div class="segmented" id="weekTabs" aria-label="Woche auswählen"></div>
          <div class="day-scroll" id="dayTabs" aria-label="Tag auswählen"></div>
          <label class="search-box">
            <span>Suchen</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Wort oder Frage" />
          </label>
          <details class="sync-box">
            <summary>Fortschritt übertragen</summary>
            <p>Nutze diesen Code, wenn du den Lernstand vom Mac auf das iPhone oder zurück übertragen möchtest.</p>
            <div class="sync-actions">
              <button id="exportProgressButton" type="button">Code erstellen</button>
              <button id="importProgressButton" type="button">Code importieren</button>
            </div>
            <textarea id="progressCode" rows="3" placeholder="Code hier einfügen"></textarea>
            <p id="syncStatus" class="sync-status"></p>
          </details>
        </section>

        <section class="day-card" id="daySummary"></section>

        <nav class="mode-tabs" aria-label="Lernmodus">
          <button class="mode-tab active" type="button" data-mode="words">Wörter</button>
          <button class="mode-tab" type="button" data-mode="questions">Fragen</button>
          <button class="mode-tab" type="button" data-mode="practice">Training</button>
        </nav>

        <section id="content" class="content-stack"></section>
      </main>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
