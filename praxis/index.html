<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#155e75" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Praxis Guide" />
    <title>Praxis Guide</title>
    <link rel="manifest" href="./manifest.webmanifest?v=1" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Medienfachfrau</p>
          <h1>Praxis Guide</h1>
          <p class="lead">Практичні завдання, відео та портфоліо по всіх тижнях.</p>
        </div>
        <div class="progress-box" aria-label="Fortschritt">
          <strong id="progressValue">0/0</strong>
          <span>готово</span>
        </div>
      </header>

      <main>
        <section class="control-panel">
          <div class="segmented" id="weekTabs" aria-label="Woche auswählen"></div>
          <div class="day-scroll" id="dayTabs" aria-label="Tag auswählen"></div>
          <label class="search-box">
            <span>Пошук</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Тема, завдання, інструмент" />
          </label>
        </section>

        <section class="summary-card" id="daySummary"></section>

        <nav class="mode-tabs" aria-label="Modus">
          <button class="mode-tab active" type="button" data-mode="task">Завдання</button>
          <button class="mode-tab" type="button" data-mode="videos">Відео</button>
          <button class="mode-tab" type="button" data-mode="portfolio">Портфоліо</button>
        </nav>

        <section id="content" class="content-stack"></section>
      </main>
    </div>

    <script src="../data.js?v=8"></script>
    <script src="./app.js?v=1"></script>
  </body>
</html>
